<style>
	path {
		opacity: 0;
		animation: piece-in 280ms ease-out forwards;
	}

	/* NOT FOUND */
	path:nth-of-type(-n + 8) {
		animation-delay: 780ms;
	}

	/* Box, left 4, 0, right 4, face */
