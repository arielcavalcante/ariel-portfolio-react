		animation-delay: 80ms;
	}

	path:nth-of-type(12) {
		animation-delay: 220ms;
	}

	path:nth-of-type(11) {
		animation-delay: 360ms;
	}

	path:nth-of-type(10) {
		animation-delay: 500ms;
	}

	path:nth-of-type(13) {
		animation-delay: 640ms;
	}

	@keyframes piece-in {
		to {
			opacity: 1;
		}
	}

	@media (prefers-reduced-motion: reduce) {
		path {
			opacity: 1;
			animation: none;
		}
	}
</style>
